name: Checks
on: push
env:
  TURBO_API: "http://127.0.0.1:8585"
  TURBO_TEAM: "decay"
  TURBO_TOKEN: "fake-token"
  FORCE_COLOR: 2

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: brunojppb/turbo-cache-server@1.0.4
        name: Turborepo remote cache
        env:
          PORT: "8585"
          S3_ACCESS_KEY: s3-mock-key
          S3_SECRET_KEY: s3-mock-key
          S3_ENDPOINT: 'http://s3-mock-key'
          S3_REGION: mock-region
          S3_BUCKET_NAME: turbo

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        name: pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('./pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checks
        run: pnpm run ci
